name: Build Richa APK

on:
  workflow_dispatch:
  push:
    branches: [ main, richa-next-ui ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download offline Vosk model
        working-directory: Richa
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o /tmp/vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          rm -rf /tmp/vosk-model
          mkdir -p /tmp/vosk-model
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          rm -rf app/src/main/assets/model-en-us
          mv /tmp/vosk-model/vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us

      - name: Build debug APK
        working-directory: Richa
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK package
        working-directory: Richa
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Richa-v1.4.1-safe-debug-apk
          path: Richa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
